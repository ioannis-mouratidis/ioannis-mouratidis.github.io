      - Contribute to AI safety research at a leading alignment-focused organization, studying how capabilities and values emerge during model training, with the goal of building scalable interventions to align frontier models
      - Develop core research infrastructure and translate exploratory prototypes into robust, scalable systems
  - role: Research Engineer/Scientist Associate V (Senior)
    org: University of Texas at Austin
    start: 2025-08-01
    end: 2026-05-01
    summary: |
      - Led a 5-member team and directed 12 research projects (4 independently, 8 collaboratively) at the intersection of AI safety and biology, developing novel methods to evaluate and restrict dual-use capabilities of agentic LLMs and biological foundation models — misuse potential, adversarial robustness, and synthetic biology risk
      - Spearheaded red-teaming of agentic AI scientists, discovering novel vulnerabilities
